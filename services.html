<body>
<div class="app">
  <header class="app-header" id="header"></header>

  <nav class="desktop-nav" id="dnav">
    <a href="dashboard.html">📊 Dashboard</a>

    <a href="services.html" class="active">💰 Harga Paket</a>

<div class="modal-bg" id="modal"><div class="modal">
  <h3 id="m-title">Tambah Layanan</h3>
  <form id="form">
    <label>Nama layanan</label>
    <input id="name" required placeholder="cth: Potong Rambut">
    <label>Harga (Rp)</label>
    <input id="price" type="number" min="0" required placeholder="30000">
    <div style="display:flex;gap:8px;margin-top:18px">
      <button type="button" class="btn btn-outline" onclick="closeM()">Batal</button>
      <button class="btn btn-gold" style="flex:1">Simpan</button>
    </div>
  </form>
</div></div>
