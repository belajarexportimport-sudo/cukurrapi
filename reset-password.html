<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — BarberCatat</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth">
<div class="auth-card">
  <h1>✂️ BarberCatat</h1>
  <p class="sub">Buat password baru</p>

  <form id="form-reset">
    <label>Password Baru (min. 6 karakter)</label>
    <input type="password" id="password" required minlength="6" autocomplete="new-password">
    <button type="submit" class="btn btn-primary">Simpan Password</button>
  </form>
  <p id="msg" class="msg"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
  let ready = false;

  // Link reset dari email memicu event PASSWORD_RECOVERY setelah Supabase
  // memproses token di URL.
  db.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') ready = true;
  });

  $('#form-reset').addEventListener('submit', async e => {
    e.preventDefault();
    if (!ready) {
      const { data } = await db.auth.getSession();
      if (!data.session) {
        $('#msg').textContent = 'Link reset tidak valid atau sudah kedaluwarsa. Minta link baru dari halaman login.';
        return;
      }
    }
    const { error } = await db.auth.updateUser({ password: $('#password').value });
    if (error) { $('#msg').textContent = error.message; return; }
    $('#msg').className = 'msg ok';
    $('#msg').innerHTML = '✅ Password berhasil diubah. <a href="login.html">Login sekarang</a>.';
    $('#form-reset').reset();
  });
</script>
</body>
</html>
