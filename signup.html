<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daftar — BarberCatat</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth">
<div class="auth-card">
  <h1>✂️ BarberCatat</h1>
  <p class="sub">Buat akun merchant kamu</p>

  <form id="form-signup">
    <label>Nama Usaha</label>
    <input type="text" id="business" required placeholder="Barber Jaya">
    <label>Email</label>
    <input type="email" id="email" required autocomplete="username">
    <label>Password (min. 6 karakter)</label>
    <input type="password" id="password" required minlength="6" autocomplete="new-password">
    <button type="submit" class="btn btn-primary">Daftar</button>
  </form>
  <p class="links"><a href="login.html">Sudah punya akun? Masuk</a></p>
  <p id="msg" class="msg"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
  $('#form-signup').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    $('#msg').className = 'msg';
    $('#msg').textContent = 'Mendaftarkan...';

    const { error } = await db.auth.signUp({
      email: $('#email').value.trim(),
      password: $('#password').value,
      options: {
        data: { business_name: $('#business').value.trim() }, // dipakai saat onboarding
        emailRedirectTo: location.origin + location.pathname.replace('signup.html', 'login.html')
      }
    });
    btn.disabled = false;
    if (error) { $('#msg').textContent = error.message; return; }

    $('#msg').className = 'msg ok';
    $('#msg').innerHTML =
      '✅ Berhasil! Cek email untuk verifikasi, lalu <a href="login.html">login</a>.';
    $('#form-signup').reset();
  });
</script>
</body>
</html>
