<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — BarberCatat</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth">
<div class="auth-card">
  <h1>✂️ BarberCatat</h1>
  <p class="sub">Pencatatan omzet barbershop</p>

  <form id="form-login">
    <label>Email</label>
    <input type="email" id="email" required placeholder="nama@email.com">
    <label>Password</label>
    <input type="password" id="password" required placeholder="••••••••">
    <button type="submit" class="btn btn-primary">Masuk</button>
  </form>

  <p class="links">
    <a href="signup.html">Belum punya akun? Daftar</a><br>
    <a href="#" id="forgot">Lupa password?</a>
  </p>
  <p id="msg" class="msg"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
  // Sudah login? langsung dashboard
  db.auth.getSession().then(({ data }) => {
    if (data.session) location.href = 'dashboard.html';
  });

  $('#form-login').addEventListener('submit', async e => {
    e.preventDefault();
    const { error } = await db.auth.signInWithPassword({
      email: $('#email').value, password: $('#password').value
    });
    if (error) return $('#msg').textContent = error.message;
    location.href = 'dashboard.html';
  });

  $('#forgot').addEventListener('click', async e => {
    e.preventDefault();
    const email = $('#email').value;
    if (!email) return $('#msg').textContent = 'Isi email dulu ya';
    await db.auth.resetPasswordForEmail(email);
    $('#msg').textContent = 'Link reset password dikirim ke email kamu.';
  });
</script>
</body>
</html>
