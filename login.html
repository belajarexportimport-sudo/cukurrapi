<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — BarberCatat</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth">
<div class="auth-card">
  <h1>✂️ BarberCatat</h1>
  <p class="sub">Pencatatan omzet barbershop</p>

  <form id="form-login">
    <label>Email</label>
    <input type="email" id="email" required placeholder="nama@email.com" autocomplete="username">
    <label>Password</label>
    <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
    <button type="submit" class="btn btn-primary">Masuk</button>
  </form>

  <p class="links">
    <a href="signup.html">Belum punya akun? Daftar</a><br>
    <a href="#" id="forgot">Lupa password?</a>
  </p>
  <p id="msg" class="msg"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
  // Sudah login? langsung ke dashboard
  db.auth.getSession().then(({ data }) => {
    if (data.session) location.href = 'dashboard.html';
  });

  $('#form-login').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    $('#msg').className = 'msg';
    $('#msg').textContent = '';
    const { error } = await db.auth.signInWithPassword({
      email: $('#email').value.trim(), password: $('#password').value
    });
    btn.disabled = false;
    if (error) { $('#msg').textContent = error.message; return; }
    location.href = 'dashboard.html';
  });

  $('#forgot').addEventListener('click', async e => {
    e.preventDefault();
    const email = $('#email').value.trim();
    if (!email) { $('#msg').textContent = 'Isi email dulu ya'; return; }
    const { error } = await db.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + location.pathname.replace('login.html', 'reset-password.html')
    });
    $('#msg').className = error ? 'msg' : 'msg ok';
    $('#msg').textContent = error ? error.message : 'Link reset password dikirim ke email kamu.';
  });
</script>
</body>
</html>
