<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/x-icon" href="icons/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1a1a2e">
<title>Admin — BarberCatat</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="app-header" id="header">
    <div style="font-size:2rem">🛡️</div>
    <div><div class="name">Panel Admin</div><div class="tag">Persetujuan merchant baru</div></div>
  </header>

  <nav class="desktop-nav">
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="admin.html" class="active">🛡️ Admin</a>
  </nav>

  <div class="app-content">
    <div id="gate"></div>

    <div id="admin-body" style="display:none">
      <div class="filters" id="tab-filters">
        <button data-status="pending" class="active">⏳ Pending</button>
        <button data-status="approved">✅ Approved</button>
        <button data-status="rejected">🚫 Rejected</button>
      </div>
      <div id="list"></div>

      <h3 style="margin:22px 0 10px">📱 Device Kasir Terdaftar</h3>
      <p style="color:var(--muted);font-size:.8rem;margin-bottom:10px">
        Setiap HP yang sudah "mengunci" nama kasir muncul di sini. Reset kalau HP pindah tangan / karyawan resign.</p>
      <div id="device-list"></div>
    </div>
  </div>
</div>

<nav class="bottom">
  <a href="dashboard.html"><span class="icon">📊</span>Dashboard</a>
  <a href="admin.html" class="active"><span class="icon">🛡️</span>Admin</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
